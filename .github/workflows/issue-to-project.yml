name: Add new issues to project board

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read
  repository-projects: write

jobs:
  add-issue-to-project:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      PROJECT_LOGIN: ajinkya446
      PROJECT_NUMBER: 4
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_NODE_ID: ${{ github.event.issue.node_id }}

    steps:
      - name: Resolve project ID
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DATA="$(gh api graphql -F login="$PROJECT_LOGIN" -F number="$PROJECT_NUMBER" -f query='query($login: String!, $number: Int!) { user(login: $login) { projectV2(number: $number) { id title } } }')"
          PROJECT_ID="$(echo "$PROJECT_DATA" | jq -r '.data.user.projectV2.id // empty')"
          PROJECT_TITLE="$(echo "$PROJECT_DATA" | jq -r '.data.user.projectV2.title // empty')"

          if [[ -z "$PROJECT_ID" ]]; then
            echo "Project #$PROJECT_NUMBER could not be resolved. Check that the secret token has access to the user project and that Project #4 exists."
            exit 1
          fi

          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "Resolved project: $PROJECT_TITLE (#$PROJECT_NUMBER)"

      - name: Skip if issue is already in the project
        id: skip
        shell: bash
        env:
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          set -euo pipefail

          ISSUE_DATA="$(gh api graphql -F owner="$REPO_OWNER" -F repo="$REPO_NAME" -F number="$ISSUE_NUMBER" -f query='query($owner: String!, $repo: String!, $number: Int!) { repository(owner: $owner, name: $repo) { issue(number: $number) { projectItems(first: 100) { nodes { project { id } } } } } }')"

          EXISTS="$(echo "$ISSUE_DATA" | jq -r --arg pid "$PROJECT_ID" '.data.repository.issue.projectItems.nodes[] | select(.project.id == $pid) | .project.id' | head -n 1)"

          if [[ -n "$EXISTS" ]]; then
            echo "already_in_project=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_in_project=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add issue to project board
        if: steps.skip.outputs.already_in_project != 'true'
        shell: bash
        env:
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          set -euo pipefail

          RESPONSE="$(gh api graphql -F projectId="$PROJECT_ID" -F contentId="$ISSUE_NODE_ID" -f query='mutation($projectId: ID!, $contentId: ID!) { addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) { item { id } } }')"

          ITEM_ID="$(echo "$RESPONSE" | jq -r '.data.addProjectV2ItemById.item.id // empty')"

          if [[ -z "$ITEM_ID" ]]; then
            echo "$RESPONSE"
            echo "Failed to add issue #$ISSUE_NUMBER to Project #$PROJECT_NUMBER. Check the PROJECT_TOKEN permissions and project access."
            exit 1
          fi

          echo "Added issue #$ISSUE_NUMBER to Project #$PROJECT_NUMBER"
